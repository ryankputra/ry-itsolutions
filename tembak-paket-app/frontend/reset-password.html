<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Ryystore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="auth-container">
            <h1>Reset Password Anda</h1>
            <form id="reset-form">
                <p>Masukkan password baru Anda di bawah ini.</p>
                <div class="form-group">
                    <label for="password">Password Baru (min. 6 karakter)</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password Baru</label>
                    <input type="password" id="confirmPassword" required minlength="6">
                </div>
                <button type="submit">Reset Password</button>
            </form>
            <div id="feedback-container"></div>
            <p class="auth-link"><a href="/">Kembali ke Halaman Login</a></p>
        </div>
    </div>
    <script>
        // Script sederhana untuk halaman ini
        const form = document.getElementById('reset-form');
        const feedback = document.getElementById('feedback-container');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            feedback.innerHTML = '';
            if (password !== confirmPassword) {
                feedback.innerHTML = '<p class="error-message">Password dan konfirmasi tidak cocok.</p>';
                return;
            }
            if (!token) {
                feedback.innerHTML = '<p class="error-message">Token tidak ditemukan. Silakan minta link reset baru.</p>';
                return;
            }

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: password })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message);

                feedback.innerHTML = `<p class="success-message">${data.message}</p>`;
                form.style.display = 'none'; // Sembunyikan form setelah berhasil
            } catch (error) {
                feedback.innerHTML = `<p class="error-message">${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
